name: BTW safety CI
on:
  push:
    branches: [fix/btw-structural-safety]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify safe production boundary
        run: |
          if grep -R --exclude-dir=node_modules --exclude-dir=.git -nE 'from ["'"'](@/lib/)?btwEngine(["'"']|\.)|require\(["'"'].*btwEngine' src/components src/pages src/hooks src/services src/lib 2>/dev/null; then
            echo 'Direct legacy VAT engine import found in production code'
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Safety tests
        run: npm run test:btw-safety
      - name: Existing tests
        run: npm test
      - name: Build
        run: npm run build
