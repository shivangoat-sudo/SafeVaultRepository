name: BTW safety CI
on:
  push:
    branches: [fix/btw-structural-safety]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify safe production boundary
        run: |
          if find src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name 'btwEngineSafe.ts' ! -name 'btwEngine.ts' ! -name 'btwEngine.validatie.ts' ! -name 'vatEngine.ts' -print0 | xargs -0 grep -nE 'from [^ ]*btwEngine(\.js)?["'"']|require\([^)]*btwEngine(\.js)?["'"']' 2>/dev/null; then
            echo 'Direct legacy VAT engine import found outside the approved safe facade/legacy adapters'
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Safety tests
        run: npm run test:btw-safety
      - name: Existing tests
        run: npm test
      - name: Build
        run: npm run build
