name: BTW safety CI
on:
  push:
    branches: [fix/btw-structural-safety]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Verify safe production boundary
        run: |
          ! grep -R --exclude-dir=node_modules --exclude-dir=.git -n 'from "@/lib/btwEngine"' src/components src/pages src/hooks src/services 2>/dev/null || (echo 'Direct legacy VAT engine import found in production code' && exit 1)
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck-errors.txt
      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-errors.txt
          git commit -m "ci: capture typecheck diagnostics" || true
          git push || true
      - name: Safety tests
        run: npm run test:btw-safety
      - name: Existing tests
        run: npm test --if-present
      - name: Build
        run: npm run build
