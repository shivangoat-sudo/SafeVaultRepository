name: Apply BTW safety fix

on:
  push:
    branches:
      - fix/btw-audit-safe-classification

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply BTW safety fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source transformation
        run: python scripts/repair_btw_engine.py
      - name: Commit repaired engine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/btwEngine.ts
          git diff --cached --quiet || git commit -m 'Apply BTW safety fix'
          git push
