name: BTW safety CI

on:
  push:
    branches:
      - fix/btw-structural-safety
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply legacy classification safety type fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/btwEngine.ts')
          s = p.read_text()
          needle = "  | 'handmatig_percentage';         // boekhouder heeft, als laatste redmiddel, alleen het BTW-percentage aangewezen (percentageOverrides)"
          replacement = "  | 'handmatig_percentage'          // boekhouder heeft, als laatste redmiddel, alleen het BTW-percentage aangewezen (percentageOverrides)\n  | 'twijfel_onvoldoende_informatie'; // onvoldoende informatie; nooit financieel geaccepteerd zonder expliciete beoordeling"
          if "| 'twijfel_onvoldoende_informatie'" not in s:
              if needle not in s:
                  raise SystemExit('Expected ClassificationSource declaration not found')
              p.write_text(s.replace(needle, replacement, 1))
              print('Applied ClassificationSource safety type fix')
          else:
              print('ClassificationSource safety type already present')
          PY
          if ! git diff --quiet -- src/lib/btwEngine.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/btwEngine.ts
            git commit -m "fix: type unresolved VAT classification explicitly"
            git push origin HEAD:fix/btw-structural-safety
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:btw-safety
      - run: npm run build
